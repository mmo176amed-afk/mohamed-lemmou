            font-weight: 700;
            transition: 0.2s;
        }
        .zed-link:hover {
            background-color: #4338ca;
            transform: translateY(-1px);

        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }

        .btn {
